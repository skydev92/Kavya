mf:
    checkpoint_path: routellm/mf_gpt4_augmented

model_translations:
    kavya-m1: router-mf-0.25
    kavya-m1-eu: router-mf-0.1
    kavya-m1-hyper: router-mf-0.05

# Model pairs for different model types
model_pairs:
    default:
        strong: gpt-4o
        weak: gpt-4o-mini
    kavya-m1-eu:
        strong: mistral/mistral-large-latest
        weak: mistral/mistral-medium-latest
    kavya-m1-hyper:
        strong: groq/llama3-70b-8192
        weak: groq/llama3-70b-8192

# Web search configuration
web_search:
    need_threshold: 30  # Score above this threshold triggers web search

# Fallback configurations for different models
fallback_configs:
    kavya-m1:
        models:
            - gpt-4o
            - gpt-4o-mini
            - gemini/gemini-2.5-flash
            - anthropic/claude-3-7-sonnet-latest
            - xai/grok-3-mini-beta
        max_retries: 6
        retry_delay: 2.0
    kavya-m1-eu:
        models:
            - mistral/mistral-large-latest   # Primary model
            - mistral/mistral-medium-latest  # First fallback
            - mistral/mistral-small-latest   # Second fallback
        max_retries: 6
        retry_delay: 3
    kavya-m1-hyper:
        models:
            - groq/llama3-70b-8192
        max_retries: 3
        retry_delay: 1.0

general_settings:
    basic_router_max_chars: 5000  # Maximum characters to analyze in prompt for basic router decisions
    routellm_force_model: "strong"  # Options: null, "strong", "weak". If set, bypasses router and uses specified model type.

# Provider definitions for fallback handling
provider_configs:
    openai:
        models:
            - gpt-4o
            - gpt-4o
    anthropic:
        models:
            - anthropic/claude-3-7-sonnet-latest
            - anthropic/claude-3-5-haiku-latest
    mistral:
        models:
            - mistral/mistral-large-latest
            - mistral/mistral-medium-latest
    gemini:
        models:
            - gemini/gemini-2.5-pro-preview-03-25
            - gemini/gemini-2.5-flash
    groq:
        models:
            - groq/llama3-70b-8192
    xai:
        models:
            - xai/grok-3-beta
            - xai/grok-3-mini-beta