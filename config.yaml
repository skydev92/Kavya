model_translations:
    default: anthropic/claude-sonnet-4-20250514
    kavya-m1: anthropic/claude-sonnet-4-20250514
    kavya-m1-eu: mistral/mistral-large-latest

# Web search configuration
web_search:
    need_threshold: 30  # Score above this threshold triggers web search

# Fallback configurations for different models
fallback_configs:
    kavya-m1:
        models:
            - anthropic/claude-sonnet-4-20250514
            - gpt-4o
            - gpt-4o-mini
            - gemini/gemini-2.5-pro
            - gemini/gemini-2.5-flash
            - mistral/mistral-large-latest
            - xai/grok-3
        max_retries: 1
        retry_delay: 1
    kavya-m1-eu:
        models:
            - mistral/mistral-large-latest   # Primary model
            - mistral/mistral-medium-latest  # First fallback
            - mistral/mistral-small-latest   # Second fallback
        max_retries: 1
        retry_delay: 1

general_settings:
    basic_router_max_chars: 5000  # Maximum characters to analyze in prompt for basic router decisions
    provider_max_retries: 1  # Maximum retries per provider in the fallback chain

# Provider definitions for fallback handling
provider_configs:
    openai:
        models:
            - gpt-4o
    anthropic:
        models:
            - anthropic/claude-sonnet-4-20250514
            - anthropic/claude-3-5-haiku-latest
    mistral:
        models:
            - mistral/mistral-large-latest
            - mistral/mistral-medium-latest
    gemini:
        models:
            - gemini/gemini-2.5-pro
            - gemini/gemini-2.5-flash
    groq:
        models:
            - groq/llama3-70b-8192
    xai:
        models:
            - xai/grok-3