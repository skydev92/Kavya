name: API Tests

on:
  pull_request:
    branches: [ 1.x ]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Set up environment variables
      run: |
        echo "JWT_TEST_TOKEN=${{ secrets.JWT_TEST_TOKEN }}" >> .env
        echo "JWT_PUBLIC_KEY_B64=${{ secrets.JWT_PUBLIC_KEY_B64 }}" >> .env
        echo "ENVIRONMENT=dev" >> .env
        echo "DATABASE_URL=postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASS }}@localhost:5432/${{ secrets.DB_NAME }}" >> .env
        echo "INSTANCE_CONNECTION_NAME=${{ secrets.INSTANCE_CONNECTION_NAME }}" >> .env
        echo "DB_USER=${{ secrets.DB_USER }}" >> .env
        echo "DB_PASS=${{ secrets.DB_PASS }}" >> .env
        echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
        echo "DB_SOCKET_DIR=${{ secrets.DB_SOCKET_DIR }}" >> .env
        echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
        echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> .env
        echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env
        echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
        echo "MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }}" >> .env
        echo "LANGFUSE_PUBLIC_KEY=${{ secrets.LANGFUSE_PUBLIC_KEY }}" >> .env
        echo "LANGFUSE_SECRET_KEY=${{ secrets.LANGFUSE_SECRET_KEY }}" >> .env
        echo "LANGFUSE_HOST=${{ secrets.LANGFUSE_HOST }}" >> .env
    
    - name: Download Cloud SQL Proxy
      run: |
        curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.16.0/cloud-sql-proxy.linux.amd64
        chmod +x cloud-sql-proxy
    
    - name: Set up Google Cloud Authentication
      run: |
        echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > /tmp/gcp-key.json
        export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
        echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> $GITHUB_ENV
    
    - name: Start Cloud SQL Proxy
      run: |
        ./cloud-sql-proxy ${{ secrets.INSTANCE_CONNECTION_NAME }} &
        sleep 10  # Wait for proxy to start
    
    - name: Start server
      run: |
        export $(grep -v '^#' .env | xargs)
        
        # Start server in background and capture output
        python -m kavya.openai_server --verbose --config config.yaml --port 8089 > server.log 2>&1 &
        SERVER_PID=$!
        
        # Wait for server to be ready (max 60 seconds)
        for i in {1..60}; do
          if grep -q "Application startup complete" server.log && grep -q "Uvicorn running on" server.log; then
            break
          fi
          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "Server process died, showing logs:"
            cat server.log
            exit 1
          fi
          sleep 1
        done
        
        # Check if we timed out
        if [ $i -eq 60 ]; then
          echo "Server failed to start within 60 seconds, showing logs:"
          cat server.log
          exit 1
        fi
    
    - name: Run API Tests
      run: |
        # Initialize summary
        echo "# 🧪 API Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Test 1: Streaming Completion
        echo "🧪 Running streaming completion test..."
        chmod +x tests/streaming-completion.sh
        
        if ./tests/streaming-completion.sh > streaming_output.txt 2>&1; then
          streaming_status="✅ **PASSED**"
        else
          streaming_status="❌ **FAILED**"
        fi
        
        echo "## 🌊 Streaming Completion Test" >> $GITHUB_STEP_SUMMARY
        echo "$streaming_status" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Curl command:**" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo 'curl -s --max-time 60 -X POST "http://localhost:8089/v1/chat/completions" \' >> $GITHUB_STEP_SUMMARY
        echo '  -H "Authorization: Bearer $JWT_TEST_TOKEN" \' >> $GITHUB_STEP_SUMMARY
        echo '  -H "Content-Type: application/json" \' >> $GITHUB_STEP_SUMMARY
        echo '  -d '"'"'{"model": "kavya-m1", "messages": [{"role": "user", "content": "Who was president of USA in 2022? Answer only with first name and last name and nothing else."}], "stream": true}'"'"'' >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "<details><summary>📋 Full Test Output</summary>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        cat streaming_output.txt >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "</details>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Test 2: Non-Streaming Completion  
        echo "🧪 Running non-streaming completion test..."
        chmod +x tests/non-streaming-completion.sh
        
        if ./tests/non-streaming-completion.sh > nonstreaming_output.txt 2>&1; then
          nonstreaming_status="✅ **PASSED**"
        else
          nonstreaming_status="❌ **FAILED**"
        fi
        
        echo "## 💬 Non-Streaming Completion Test" >> $GITHUB_STEP_SUMMARY
        echo "$nonstreaming_status" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Curl command:**" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo 'curl -s --max-time 60 -X POST "http://localhost:8089/v1/chat/completions" \' >> $GITHUB_STEP_SUMMARY
        echo '  -H "Authorization: Bearer $JWT_TEST_TOKEN" \' >> $GITHUB_STEP_SUMMARY
        echo '  -H "Content-Type: application/json" \' >> $GITHUB_STEP_SUMMARY
        echo '  -d '"'"'{"model": "kavya-m1", "messages": [{"role": "user", "content": "Who was president of USA in 2022? Answer only with first name and last name and nothing else."}]}'"'"'' >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "<details><summary>📋 Full Test Output</summary>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        cat nonstreaming_output.txt >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "</details>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Test 3: Structured Completion
        echo "🧪 Running structured completion test..."
        chmod +x tests/structured-completion.sh
        
        if ./tests/structured-completion.sh > structured_output.txt 2>&1; then
          structured_status="✅ **PASSED**"
        else
          structured_status="❌ **FAILED**"
        fi
        
        echo "## 📊 Structured Completion Test" >> $GITHUB_STEP_SUMMARY
        echo "$structured_status" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Curl command:**" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo 'curl -s --max-time 60 -X POST "http://localhost:8089/v1/chat/completions" \' >> $GITHUB_STEP_SUMMARY
        echo '  -H "Authorization: Bearer $JWT_TEST_TOKEN" \' >> $GITHUB_STEP_SUMMARY
        echo '  -H "Content-Type: application/json" \' >> $GITHUB_STEP_SUMMARY
        echo '  -d '"'"'{"model": "kavya-m1", "messages": [{"role": "user", "content": "Generate a person with name and age in JSON format."}], "response_format": {"type": "json_object"}}'"'"'' >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "<details><summary>📋 Full Test Output</summary>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        cat structured_output.txt >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "</details>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Test 4: Image Analysis
        echo "🧪 Running image analysis test..."
        chmod +x tests/image-analysis.sh
        
        if ./tests/image-analysis.sh > image_output.txt 2>&1; then
          image_status="✅ **PASSED**"
        else
          image_status="❌ **FAILED**"
        fi
        
        echo "## 🖼️ Image Analysis Test" >> $GITHUB_STEP_SUMMARY
        echo "$image_status" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Description:** Tests multi-modal content processing with text + image input" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Curl command:**" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo 'curl -s --max-time 60 -X POST "http://localhost:8089/v1/chat/completions" \' >> $GITHUB_STEP_SUMMARY
        echo '  -H "Authorization: Bearer $JWT_TEST_TOKEN" \' >> $GITHUB_STEP_SUMMARY
        echo '  -H "Content-Type: application/json" \' >> $GITHUB_STEP_SUMMARY
        echo '  -d '"'"'{"model": "kavya-m1", "messages": [{"role": "user", "content": [{"type": "text", "text": "What text do you see in this image?"}, {"type": "image_url", "image_url": {"url": "data:image/png;base64,..."}}]}]}'"'"'' >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "<details><summary>📋 Full Test Output</summary>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        cat image_output.txt >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "</details>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Test 5: Providers Parameter
        echo "🧪 Running providers parameter test..."
        chmod +x tests/providers-parameter.sh
        
        if ./tests/providers-parameter.sh > providers_output.txt 2>&1; then
          providers_status="✅ **PASSED**"
        else
          providers_status="❌ **FAILED**"
        fi
        
        echo "## ⚙️ Providers Parameter Test" >> $GITHUB_STEP_SUMMARY
        echo "$providers_status" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Description:** Tests the 'providers' parameter with various valid configurations." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "<details><summary>📋 Full Test Output</summary>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        cat providers_output.txt >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "</details>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Summary
        if [[ "$streaming_status" == *"FAILED"* ]] || [[ "$nonstreaming_status" == *"FAILED"* ]] || [[ "$structured_status" == *"FAILED"* ]] || [[ "$image_status" == *"FAILED"* ]] || [[ "$providers_status" == *"FAILED"* ]]; then
          echo "## ❌ Test Suite Failed" >> $GITHUB_STEP_SUMMARY
          echo "One or more tests failed. Check the detailed outputs above." >> $GITHUB_STEP_SUMMARY
          echo "❌ One or more API tests failed"
          exit 1
        else
          echo "## ✅ All Tests Passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ All API tests passed!"
        fi
    
    - name: Stop server and proxy
      run: |
        pkill -f "kavya.openai_server" || true
        pkill -f "cloud-sql-proxy" || true 