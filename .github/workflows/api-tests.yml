        # Summary
        if [[ "$streaming_status" == *"FAILED"* ]] || [[ "$nonstreaming_status" == *"FAILED"* ]] || [[ "$structured_status" == *"FAILED"* ]] || [[ "$image_status" == *"FAILED"* ]] || [[ "$provider_openai_status" == *"FAILED"* ]] || [[ "$provider_anthropic_status" == *"FAILED"* ]] || [[ "$provider_default_status" == *"FAILED"* ]] || [[ "$provider_mistral_status" == *"FAILED"* ]] || [[ "$provider_gemini_status" == *"FAILED"* ]] || [[ "$provider_xai_status" == *"FAILED"* ]] || [[ "$provider_fallback_oa_status" == *"FAILED"* ]] || [[ "$provider_fallback_ao_status" == *"FAILED"* ]] || [[ "$provider_fallback_all_status" == *"FAILED"* ]] || [[ "$provider_fallback_mixed_status" == *"FAILED"* ]] || [[ "$provider_fallback_mg_status" == *"FAILED"* ]] || [[ "$web_search_streaming_status" == *"FAILED"* ]] || [[ "$web_search_non_streaming_status" == *"FAILED"* ]]; then
          echo "## ❌ Test Suite Failed" >> $GITHUB_STEP_SUMMARY
