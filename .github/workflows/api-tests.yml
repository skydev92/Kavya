        echo "</details>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Test 5: Provider OpenAI
        echo "## ⚙️ Provider Test: OpenAI" >> $GITHUB_STEP_SUMMARY
        echo "$provider_openai_status" >> $GITHUB_STEP_SUMMARY
