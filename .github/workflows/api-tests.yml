name: API Tests

on:
  pull_request:
    branches: [ 1.x ]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Set up environment variables
      run: |
        echo "JWT_TEST_TOKEN=${{ secrets.JWT_TEST_TOKEN }}" >> .env
        echo "JWT_PUBLIC_KEY_B64=${{ secrets.JWT_PUBLIC_KEY_B64 }}" >> .env
        echo "ENVIRONMENT=dev" >> .env
        echo "DATABASE_URL=postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASS }}@localhost:5432/${{ secrets.DB_NAME }}" >> .env
        echo "INSTANCE_CONNECTION_NAME=${{ secrets.INSTANCE_CONNECTION_NAME }}" >> .env
        echo "DB_USER=${{ secrets.DB_USER }}" >> .env
        echo "DB_PASS=${{ secrets.DB_PASS }}" >> .env
        echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
        echo "DB_SOCKET_DIR=${{ secrets.DB_SOCKET_DIR }}" >> .env
        echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
        echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> .env
        echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env
        echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
        echo "MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }}" >> .env
        echo "XAI_API_KEY=${{ secrets.XAI_API_KEY }}" >> .env
        echo "PERPLEXITYAI_API_KEY=${{ secrets.PERPLEXITYAI_API_KEY }}" >> .env
        echo "LANGFUSE_PUBLIC_KEY=${{ secrets.LANGFUSE_PUBLIC_KEY }}" >> .env
        echo "LANGFUSE_SECRET_KEY=${{ secrets.LANGFUSE_SECRET_KEY }}" >> .env
        echo "LANGFUSE_HOST=${{ secrets.LANGFUSE_HOST }}" >> .env
    
    - name: Download Cloud SQL Proxy
      run: |
        curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.16.0/cloud-sql-proxy.linux.amd64
        chmod +x cloud-sql-proxy
    
    - name: Set up Google Cloud Authentication
      run: |
        echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > /tmp/gcp-key.json
        export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
        echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> $GITHUB_ENV
    
    - name: Start Cloud SQL Proxy
      run: |
        ./cloud-sql-proxy ${{ secrets.INSTANCE_CONNECTION_NAME }} &
        sleep 10  # Wait for proxy to start
    
    - name: Start server
      run: |
        export $(grep -v '^#' .env | xargs)
        
        # Start server in background and capture output
        python -m kavya.openai_server --verbose --config config.yaml --port 8089 > server.log 2>&1 &
        SERVER_PID=$!
        
        # Wait for server to be ready (max 60 seconds)
        for i in {1..60}; do
          if grep -q "Application startup complete" server.log && grep -q "Uvicorn running on" server.log; then
            break
          fi
          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "Server process died, showing logs:"
            cat server.log
            exit 1
          fi
          sleep 1
        done
        
        # Check if we timed out
        if [ $i -eq 60 ]; then
          echo "Server failed to start within 60 seconds, showing logs:"
          cat server.log
          exit 1
        fi
    
    - name: Run API Tests
      run: |
        # Initialize summary
        echo "# 🧪 API Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Function to run a test and capture its output/status
        run_test() {
          local test_name="$1"
          local script_name="$2"
          local output_file="$3"
          local status_var_name="$4"
        
          echo "🧪 Running $test_name..."
          chmod +x "$script_name"
        
          # Disable exit on error temporarily to capture status
          set +e
          # Run the script, tee output to both the console and a file
          "$script_name" 2>&1 | tee "$output_file"
          local exit_code=${PIPESTATUS[0]}
          set -e
        
          # Strip ANSI color codes from the output file so it renders correctly in the summary
          sed -i -E 's/\x1b\[[0-9;]*[a-zA-Z]//g' "$output_file"
        
          if [ $exit_code -eq 0 ]; then
            eval "$status_var_name='✅ **PASSED**'"
          else
            eval "$status_var_name='❌ **FAILED**'"
          fi
        }
        
        # Run all tests
        run_test "streaming completion test" "tests/streaming-completion.sh" "streaming_output.txt" "streaming_status"
        run_test "non-streaming completion test" "tests/non-streaming-completion.sh" "nonstreaming_output.txt" "nonstreaming_status"
        run_test "structured completion test" "tests/structured-completion.sh" "structured_output.txt" "structured_status"
        run_test "image analysis test" "tests/image-analysis.sh" "image_output.txt" "image_status"
        run_test "provider openai test" "tests/provider-openai.sh" "provider_openai_output.txt" "provider_openai_status"
        run_test "provider anthropic test" "tests/provider-anthropic.sh" "provider_anthropic_output.txt" "provider_anthropic_status"
        run_test "provider default test" "tests/provider-default.sh" "provider_default_output.txt" "provider_default_status"
        run_test "provider mistral test" "tests/provider-mistral.sh" "provider_mistral_output.txt" "provider_mistral_status"
        run_test "provider gemini test" "tests/provider-gemini.sh" "provider_gemini_output.txt" "provider_gemini_status"
        run_test "provider xai test" "tests/provider-xai.sh" "provider_xai_output.txt" "provider_xai_status"
        run_test "provider fallback openai anthropic test" "tests/provider-fallback-openai-anthropic.sh" "provider_fallback_oa_output.txt" "provider_fallback_oa_status"
        run_test "provider fallback anthropic openai test" "tests/provider-fallback-anthropic-openai.sh" "provider_fallback_ao_output.txt" "provider_fallback_ao_status"
        run_test "provider fallback all test" "tests/provider-fallback-all.sh" "provider_fallback_all_output.txt" "provider_fallback_all_status"
        run_test "provider fallback mixed test" "tests/provider-fallback-mixed.sh" "provider_fallback_mixed_output.txt" "provider_fallback_mixed_status"
        run_test "provider fallback mistral gemini test" "tests/provider-fallback-mistral-gemini.sh" "provider_fallback_mg_output.txt" "provider_fallback_mg_status"
        run_test "web search streaming test" "tests/web-search-streaming.sh" "web_search_streaming_output.txt" "web_search_streaming_status"
        run_test "web search non-streaming test" "tests/web-search-non-streaming.sh" "web_search_non_streaming_output.txt" "web_search_non_streaming_status"

        # --- Build Summary ---

        # Test 1: Streaming Completion
        echo "## 🌊 Streaming Completion Test" >> $GITHUB_STEP_SUMMARY
        echo "$streaming_status" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Curl command:**" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo 'curl -s --max-time 60 -X POST "http://localhost:8089/v1/chat/completions" \' >> $GITHUB_STEP_SUMMARY
        echo '  -H "Authorization: Bearer $JWT_TEST_TOKEN" \' >> $GITHUB_STEP_SUMMARY
        echo '  -H "Content-Type: application/json" \' >> $GITHUB_STEP_SUMMARY
        echo '  -d '"'"'{"model": "kavya-m1", "messages": [{"role": "user", "content": "Who was president of USA in 2022? Answer only with first name and last name and nothing else."}], "stream": true}'"'"'' >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "<details><summary>📋 Full Test Output</summary>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        cat streaming_output.txt >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "</details>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Test 2: Non-Streaming Completion  
        echo "## 💬 Non-Streaming Completion Test" >> $GITHUB_STEP_SUMMARY
        echo "$nonstreaming_status" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Curl command:**" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo 'curl -s --max-time 60 -X POST "http://localhost:8089/v1/chat/completions" \' >> $GITHUB_STEP_SUMMARY
        echo '  -H "Authorization: Bearer $JWT_TEST_TOKEN" \' >> $GITHUB_STEP_SUMMARY
        echo '  -H "Content-Type: application/json" \' >> $GITHUB_STEP_SUMMARY
        echo '  -d '"'"'{"model": "kavya-m1", "messages": [{"role": "user", "content": "Who was president of USA in 2022? Answer only with first name and last name and nothing else."}]}'"'"'' >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "<details><summary>📋 Full Test Output</summary>" >> $GITHUB_STEP_SUMMARY
