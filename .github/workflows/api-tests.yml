        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Test 4: Image Analysis
        echo "## 🖼️ Image Analysis Test" >> $GITHUB_STEP_SUMMARY
        echo "$image_status" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
