        echo "</details>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Test 10: Provider XAI
        echo "## ⚙️ Provider Test: XAI" >> $GITHUB_STEP_SUMMARY
        echo "$provider_xai_status" >> $GITHUB_STEP_SUMMARY
        echo "<details><summary>📋 Full Test Output</summary>" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        cat provider_xai_output.txt >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "</details>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Test 11: Provider Fallback OpenAI/Anthropic
        echo "## ⚙️ Provider Test: Fallback OpenAI/Anthropic" >> $GITHUB_STEP_SUMMARY
        echo "$provider_fallback_oa_status" >> $GITHUB_STEP_SUMMARY
        echo "<details><summary>📋 Full Test Output</summary>" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        cat provider_fallback_oa_output.txt >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "</details>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Test 12: Provider Fallback Anthropic/OpenAI
        echo "## ⚙️ Provider Test: Fallback Anthropic/OpenAI" >> $GITHUB_STEP_SUMMARY
        echo "$provider_fallback_ao_status" >> $GITHUB_STEP_SUMMARY
        echo "<details><summary>📋 Full Test Output</summary>" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        cat provider_fallback_ao_output.txt >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "</details>" >> $GITHUB_STEP_SUMMARY
