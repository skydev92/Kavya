name: Deploy to AWS EC2

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cd /path/to/your/project
            git fetch --all
            git checkout ${{ github.ref_name }}
            docker build -t kavya:${{ github.ref_name }} .
            docker stop kavya-container || true
            docker rm kavya-container || true
            docker run -d --name kavya-container -p 6060:6060 kavya:${{ github.ref_name }}
            # Add any additional deployment commands here

      - name: Verify Deployment
        run: |
          # Add commands to verify the deployment was successful
          # For example, curl the application endpoint or run tests