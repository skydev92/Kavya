name: Build and Push to ECR

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3
      - name: Login to Amazon ECR
        id: login-ecr
        run: |
          aws ecr get-login-password --region eu-west-3 | 
          docker login --username AWS --password-stdin 472053181235.dkr.ecr.eu-west-3.amazonaws.com
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: 472053181235.dkr.ecr.eu-west-3.amazonaws.com
          ECR_REPOSITORY: kavya
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG . || exit 1
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG || exit 1