name: Deploy to AWS

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3
      - name: Login to Amazon ECR
        id: login-ecr
        run: |
          aws ecr get-login-password --region eu-west-3 | 
          docker login --username AWS --password-stdin 472053181235.dkr.ecr.eu-west-3.amazonaws.com
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: 472053181235.dkr.ecr.eu-west-3.amazonaws.com
          ECR_REPOSITORY: kavya
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG . || exit 1
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG || exit 1

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "latest"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3
      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform-aws
      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: ./terraform-aws
        env:
          TF_VAR_image_tag: ${{ github.ref_name }}
      - name: Terraform Apply
        run: terraform apply tfplan
        working-directory: ./terraform-aws
        env:
          TF_VAR_image_tag: ${{ github.ref_name }}
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform-aws